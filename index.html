<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión de Trading — Panel</title>
<style>
  :root{
    --bg:#070d18; --card:rgba(255,255,255,.04); --card-solid:#101827; --card2:#0b1322;
    --line:rgba(255,255,255,.09); --text:#eef3fa; --muted:#9db0ca;
    --gold:#f5b942; --gold2:#d48806; --green:#22c55e; --red:#ef4444;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:
      radial-gradient(900px 500px at 85% -10%, rgba(245,185,66,.13), transparent 60%),
      radial-gradient(700px 500px at -10% 110%, rgba(38,92,180,.14), transparent 60%),
      var(--bg);
    color:var(--text); font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; min-height:100vh;}
  button{cursor:pointer; font-family:inherit;}
  input,select,textarea{background:rgba(255,255,255,.05); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:11px 12px; font-size:15px; width:100%;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--gold); border-color:transparent;}
  label{font-size:13px; color:var(--muted); display:block; margin:12px 0 6px;}

  /* ---------- AUTENTICACIÓN EN SERVIDOR ---------- */
  function showError(msg){ var e=$("loginError"); e.textContent=msg; e.style.display="block"; }
  function configureLogin(initialized){
    hasAccount=initialized;
    $("loginError").style.display="none";
    $("setupTokenWrap").style.display=initialized?"none":"block";
    $("confirmWrap").style.display=initialized?"none":"block";
    $("loginSub").textContent=initialized?"Inicia sesión en tu cuenta":"Crea la primera cuenta privada";
    $("loginBtn").textContent=initialized?"Iniciar sesión":"Crear cuenta privada";
    $("password").setAttribute("autocomplete",initialized?"current-password":"new-password");
    $("authNotice").textContent=initialized
      ?"Cuenta privada. La primera cuenta ya está configurada y el registro público permanece cerrado."
      :"Configura la única cuenta. Necesitas el token inicial guardado como secreto en Cloudflare.";
  }
  $("loginForm").addEventListener("submit",async function(ev){
    ev.preventDefault();
    $("loginBtn").disabled=true;
    $("loginError").style.display="none";
    var email=$("email").value.trim().toLowerCase(),password=$("password").value;
    try{
      if(!email||!password) throw new Error("Completa el correo y la contraseña.");
      var body={action:hasAccount?"login":"setup",email:email,password:password};
      if(!hasAccount){
        if(password.length<12) throw new Error("La contraseña debe tener al menos 12 caracteres.");
        if(password!==$("password2").value) throw new Error("Las contraseñas no coinciden.");
        body.setupToken=$("setupToken").value;
      }
      var result=await api("/api/auth",{method:"POST",body:JSON.stringify(body)});
      configureLogin(true);
      await enterApp(result.email);
    }catch(error){showError(error.message||"No se pudo iniciar sesión.");}
    finally{$("loginBtn").disabled=false;}
  });
  async function initializeAuth(){
    try{
      var status=await api("/api/auth");
      configureLogin(!!status.initialized);
      if(status.initialized){
        try{
          var current=await api("/api/data");
          await enterApp($("email").value,current);
        }catch(error){if(error.status!==401) showError(error.message||"El servidor no está disponible.");}
      }
    }catch(error){showError("El servidor no está configurado o no responde. Abre la versión publicada en Cloudflare Pages.");}
  }

  /* ---------- APP / MENÚ DESLIZABLE ---------- */
  function openDrawer(){
    $("drawer").classList.add("open"); document.body.classList.add("drawer-open");
    if(window.innerWidth < 1024){ $("scrim").classList.add("show"); }
  }
  function closeDrawer(){
    $("drawer").classList.remove("open"); document.body.classList.remove("drawer-open");
    $("scrim").classList.remove("show");
  }
  function toggleDrawer(){
    if($("drawer").classList.contains("open")){ closeDrawer(); } else { openDrawer(); }
  }
  $("burgerBtn").addEventListener("click", toggleDrawer);
  $("scrim").addEventListener("click", closeDrawer);

  async function enterApp(email,payload){
    if(!payload) payload=await api("/api/data");
    appData=payload.data;
    $("loginView").style.display="none";
    $("appView").style.display="block";
    $("userEmail").textContent=email||"";
    $("topEmail").textContent=email||"";
    $("cfgEmail").textContent=email||"";
    if(window.innerWidth>=1024){openDrawer();}
    renderOps();renderStats();renderPos();loadDiario();
  }
  $("logoutBtn").addEventListener("click",async function(){
    try{
      await saveQueue.catch(function(){});
      await api("/api/auth",{method:"POST",body:JSON.stringify({action:"logout"})});
    }finally{location.reload();}
  });

  /* Navegación del menú */
  function goSection(name){
    document.querySelectorAll(".nav-item").forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-sec")===name);
    });
    document.querySelectorAll(".section").forEach(function(s){ s.classList.remove("active"); });
    $("sec-"+name).classList.add("active");
    if(window.innerWidth < 1024){ closeDrawer(); }
    window.scrollTo(0,0);
  }
  document.querySelectorAll(".nav-item").forEach(function(btn){
    btn.addEventListener("click", function(){ goSection(btn.getAttribute("data-sec")); });
  });

  /* Botones «Usar en mi posición de hoy» de Estrategias */
  document.querySelectorAll(".strat .use").forEach(function(btn){
    btn.addEventListener("click", function(){
      var dir = btn.getAttribute("data-dir");
      if(dir){ $("posDir").value = dir; }
      $("posNota").value = btn.getAttribute("data-nota") || "";
      goSection("posiciones");
      $("posEntrada").focus();
    });
  });

  /* ---------- HISTORIAL ---------- */
  function showHist(asset){
    document.querySelectorAll(".hist-panel").forEach(function(p){
      p.classList.toggle("active", p.id==="hist-"+asset);
    });
    document.querySelectorAll(".sub-item").forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-hist")===asset);
    });
  }
  document.querySelectorAll(".sub-item").forEach(function(btn){
    btn.addEventListener("click", function(){
      goSection("historial"); showHist(btn.getAttribute("data-hist"));
    });
  });
  $("histToggle").addEventListener("click", function(){
    $("histSub").classList.toggle("open");
    $("histToggle").classList.toggle("open");
  });

  /* ---------- OPERACIONES ---------- */
  function renderOps(){
    var ops=getOps(), body=$("opBody"); body.innerHTML="";
    $("opEmpty").style.display = ops.length ? "none" : "block";
    ops.slice().reverse().forEach(function(op, ri){
      var idx = ops.length-1-ri;
      var tr=document.createElement("tr");
      [op.fecha, op.activo, op.dir, op.entrada||"—", op.salida||"—"].forEach(function(v){
        var td=document.createElement("td"); td.textContent=v; tr.appendChild(td);
      });
      var tdR=document.createElement("td"); tdR.textContent=money(op.resultado);
      tdR.className = op.resultado>=0 ? "pos" : "neg"; tr.appendChild(tdR);
      var tdD=document.createElement("td");
      var b=document.createElement("button"); b.className="del"; b.textContent="✕"; b.title="Eliminar";
      b.addEventListener("click", function(){ var o=getOps(); o.splice(idx,1); setOps(o); renderOps(); renderStats(); });
      tdD.appendChild(b); tr.appendChild(tdD);
      body.appendChild(tr);
    });
  }
  $("opForm").addEventListener("submit", function(ev){
    ev.preventDefault();
    var ops=getOps();
    ops.push({
      fecha: $("opFecha").value, activo: $("opActivo").value.trim(),
      dir: $("opDir").value, entrada: $("opEntrada").value, salida: $("opSalida").value,
      resultado: parseFloat($("opResultado").value)||0
    });
    setOps(ops); renderOps(); renderStats();
    $("opActivo").value=""; $("opEntrada").value=""; $("opSalida").value=""; $("opResultado").value="";
  });
  $("opFecha").value = todayStr();

  /* ---------- ESTADÍSTICAS / PANEL ---------- */
  function renderStats(){
    var ops=getOps();
    var total=ops.reduce(function(s,o){return s+o.resultado;},0);
    var hoy=todayStr(), mes=hoy.slice(0,7);
    var rHoy=ops.filter(function(o){return o.fecha===hoy;}).reduce(function(s,o){return s+o.resultado;},0);
    var rMes=ops.filter(function(o){return (o.fecha||"").slice(0,7)===mes;}).reduce(function(s,o){return s+o.resultado;},0);
    var gan=ops.filter(function(o){return o.resultado>0;}).length;
    var per=ops.filter(function(o){return o.resultado<0;}).length;
    function setV(id, val, signed){
      var el=$(id); if(!ops.length){ el.textContent="—"; el.className="v"; return; }
      el.textContent = signed ? money(val) : val;
      el.className = "v" + (signed ? (val>0?" pos":(val<0?" neg":"")) : "");
    }
    setV("stBalance", total, true); setV("stHoy", rHoy, true); setV("stMes", rMes, true);
    var cerradas=gan+per;
    $("stWin").textContent = cerradas ? Math.round(gan/cerradas*100)+"%" : "—";
    $("panelHint").style.display = ops.length ? "none" : "block";
    $("esTotal").textContent = ops.length || "—";
    $("esGan").textContent = ops.length ? gan : "—";
    $("esPer").textContent = ops.length ? per : "—";
    $("esMejor").textContent = ops.length ? money(Math.max.apply(null, ops.map(function(o){return o.resultado;}))) : "—";
  }

  /* ---------- POSICIONES DIARIAS ---------- */

  function setBackupMessage(message,isError){
    var el=$("backupMsg");el.textContent=message;el.style.color=isError?"var(--red)":"var(--muted)";
  }
  $("backupExport").addEventListener("click",function(){
    var payload={format:"gestion-trading-backup",version:1,exportedAt:new Date().toISOString(),data:appData};
    var blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    var url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download="respaldo-trading-"+todayStr()+".json";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},1000);
    setBackupMessage("Respaldo descargado. Guárdalo en un lugar seguro.",false);
  });
  $("backupImport").addEventListener("change",function(ev){
    var file=ev.target.files&&ev.target.files[0];
    if(!file)return;
    if(file.size>10*1024*1024){setBackupMessage("El archivo supera el máximo de 10 MB.",true);ev.target.value="";return;}
    var reader=new FileReader();
    reader.onerror=function(){setBackupMessage("No se pudo leer el archivo.",true);ev.target.value="";};
    reader.onload=async function(){
      try{
        var backup=JSON.parse(String(reader.result||"")),d=backup&&backup.data;
        if(backup.format!=="gestion-trading-backup"||backup.version!==1||!d||
          !Array.isArray(d.operations)||!Array.isArray(d.positions)||
          !d.diary||typeof d.diary!=="object"||Array.isArray(d.diary)||
          d.operations.length>50000||d.positions.length>50000||Object.keys(d.diary).length>50000){
          throw new Error("El formato del respaldo no es válido.");
        }
        if(!confirm("Restaurar reemplazará operaciones, posiciones y notas del servidor. Descarga un respaldo antes. ¿Deseas continuar?")){
          ev.target.value="";return;
        }
        await api("/api/data",{method:"PUT",body:JSON.stringify({data:d})});
        appData=d;renderOps();renderStats();renderPos();loadDiario();
        setBackupMessage("Respaldo restaurado correctamente en el servidor.",false);
      }catch(error){setBackupMessage(error.message||"No se pudo restaurar el respaldo.",true);}
      ev.target.value="";
    };
    reader.readAsText(file);
  });
  function renderPos(){
    var pos=getPos(), body=$("posBody"); body.innerHTML="";
    $("posEmpty").style.display = pos.length ? "none" : "block";
    pos.slice().reverse().forEach(function(p, ri){
      var idx = pos.length-1-ri;
      var tr=document.createElement("tr");
      [p.fecha, p.activo, p.dir, p.entrada||"—", p.stop||"—", p.objetivo||"—", p.nota||""].forEach(function(v){
        var td=document.createElement("td"); td.textContent=v; tr.appendChild(td);
      });
      var tdD=document.createElement("td");
      var b=document.createElement("button"); b.className="del"; b.textContent="✕"; b.title="Eliminar";
      b.addEventListener("click", function(){ var q=getPos(); q.splice(idx,1); setPos(q); renderPos(); });
      tdD.appendChild(b); tr.appendChild(tdD);
      body.appendChild(tr);
    });
  }
  $("posForm").addEventListener("submit", function(ev){
    ev.preventDefault();
    var pos=getPos();
    pos.push({
      fecha: $("posFecha").value, activo: $("posActivo").value.trim(),
      dir: $("posDir").value, entrada: $("posEntrada").value,
      stop: $("posStop").value, objetivo: $("posObjetivo").value, nota: $("posNota").value.trim()
    });
    setPos(pos); renderPos();
    $("posEntrada").value=""; $("posStop").value=""; $("posObjetivo").value=""; $("posNota").value="";
  });
  $("posFecha").value = todayStr();

  /* ---------- DIARIO ---------- */
  function loadDiario(){
    var d=getDiario();
    $("diarioTexto").value = d[todayStr()] || "";
  }
  $("diarioGuardar").addEventListener("click", function(){
    var d=getDiario();
    d[todayStr()] = $("diarioTexto").value;
    appData.diary=d;
    persistData().then(function(){ $("diarioMsg").textContent = "Nota guardada en el servidor ("+todayStr()+")."; })
      .catch(function(error){ $("diarioMsg").textContent=error.message||"No se pudo guardar la nota."; });
  });

  /* ---------- CONFIGURACIÓN ---------- */
  $("cfgCambiar").addEventListener("click",async function(){
    var e=$("cfgError");e.style.display="none";
    try{
      await api("/api/auth",{method:"POST",body:JSON.stringify({
        action:"change-password",currentPassword:$("cfgActual").value,newPassword:$("cfgNueva").value
      })});
      $("cfgActual").value="";$("cfgNueva").value="";
      alert("Contraseña actualizada. Se cerraron las demás sesiones.");
    }catch(error){e.textContent=error.message||"No se pudo cambiar la contraseña.";e.style.display="block";}
  });
  $("cfgBorrar").addEventListener("click",async function(){
    if(!confirm("Se borrarán del servidor todas tus operaciones, posiciones y notas. Esta acción no se puede deshacer. ¿Continuar?")) return;
    try{
      await api("/api/data",{method:"DELETE"});
      appData={operations:[],positions:[],diary:{}};
      renderOps();renderStats();renderPos();loadDiario();
      setBackupMessage("Se borraron los registros del servidor.",false);
    }catch(error){setBackupMessage(error.message||"No se pudieron borrar los registros.",true);}
  });

  initializeAuth();
})();
</script>
</body>
</html>
